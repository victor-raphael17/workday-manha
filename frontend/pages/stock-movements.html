<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CA Pharmacy | Stock movements</title>
    <link rel="icon" href="../assets/images/logo-mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/theme.css" />
    <link rel="stylesheet" href="../assets/css/app.css" />
    <script
      src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.min.js"
      defer
    ></script>
  </head>
  <body data-page="stock-movements">
    <div class="app-scrim d-lg-none" id="appScrim"></div>
    <div class="app-shell">
      <aside class="app-sidebar" id="appSidebar"></aside>
      <div class="app-main">
        <header class="app-topbar" id="appTopbar"></header>

        <main class="app-content container-fluid py-4 px-3 px-xl-4">
          <section class="mb-4">
            <span class="page-kicker">Inventory audit</span>
            <h1 class="page-title mb-1">Stock movements</h1>
            <p class="page-subtitle mb-0">
              Audit trail of manual inventory adjustments and their reasons.
            </p>
          </section>

          <article class="card border-0 shadow-sm list-card">
            <div class="table-responsive px-4 py-2">
              <table class="table align-middle data-table mb-0">
                <thead>
                  <tr>
                    <th>Medication</th>
                    <th>SKU</th>
                    <th class="text-end">Change</th>
                    <th>Reason</th>
                    <th>Date</th>
                  </tr>
                </thead>
                <tbody data-stock-movements-body></tbody>
              </table>
            </div>
          </article>
        </main>
      </div>
    </div>

    <script type="module" src="../assets/js/main.js"></script>
  </body>
</html>
